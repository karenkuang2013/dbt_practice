name: PR Accepted Deployment
run-name: PR from ${{ github.actor }} accepted - triggered a ${{ github.event_name }}
on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: read

jobs:
  run-snowflake-dbt-job:
    if: github.event.pull_request.merged == true
    name: "Run on Accepted PR"
    runs-on: ubuntu-latest
    environment: prod
    env:
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
      SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
      SNOWFLAKE_DATABASE: ${{ vars.SNOWFLAKE_DATABASE }}
      SNOWFLAKE_SCHEMA: ${{ vars.SNOWFLAKE_PROD_SCHEMA }}

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Install Snowflake CLI
        uses: snowflakedb/snowflake-actions@v3

      - name: Check Snowflake CLI Version
        run: snow --version

      - name: Test Snowflake connection
        run: snow connection test -x

      - name: Deploy dbt project object from dbt_data
        run: snow dbt deploy tasty_bytes_dbt_object_gh_action --source dbt_data --default-target prod --dbt-version 1.12.3 -x

      - name: List Snowflake dbt project objects
        run: snow dbt list --format JSON -x
