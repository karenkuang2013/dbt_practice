name: PR Accepted Deployment
run-name: PR from ${{ github.actor }} accepted - triggered a ${{ github.event_name }}
on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: read

jobs:
  run-snowflake-dbt-job:
    if: github.event_name == 'push' || github.event.pull_request.merged == true
    name: "Run on Accepted PR or Push to main"
    runs-on: ubuntu-latest
    environment: prod
    env:
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
      DBT_ENV_SECRET_PRIVATE_KEY_PASSPHRASE: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_PASSPHRASE }}
      SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
      SNOWFLAKE_DATABASE: ${{ vars.SNOWFLAKE_DATABASE }}
      SNOWFLAKE_SCHEMA: ${{ vars.SNOWFLAKE_PROD_SCHEMA }}

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dbt-snowflake
        run: pip install dbt-snowflake
      - name: Write Snowflake private key file
        env:
          SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf "%s\n" "$SNOWFLAKE_PRIVATE_KEY" > ~/.ssh/dbt_rsa_key.p8
          chmod 600 ~/.ssh/dbt_rsa_key.p8
          echo "DBT_ENV_SECRET_PRIVATE_KEY_PATH=$HOME/.ssh/dbt_rsa_key.p8" >> "$GITHUB_ENV"

      - name: Run dbt deps and build
        run: |
          dbt deps --project-dir dbt_data --profiles-dir dbt_data
          dbt build --project-dir dbt_data --profiles-dir dbt_data --target prod
      - name: List Snowflake dbt project objects
        run: snow dbt list --format JSON -x
